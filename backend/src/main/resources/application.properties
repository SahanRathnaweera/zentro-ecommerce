spring.application.name=backend
server.port=${PORT:8080}

# Optional local overrides (this file is NOT pushed to GitHub)
spring.config.import=optional:classpath:application-local.properties

# Database (values come from environment variables in production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/zentro_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Frontend origin allowed by CORS
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}